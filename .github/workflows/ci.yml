name: CI

# Checks only. The client needs the Python server (aiverse-server) to show anything,
# so a static GitHub Pages deployment no longer works on its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/check_repo.py
      - run: npm run verify
